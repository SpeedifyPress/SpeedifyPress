# Add inside the site's server {} block. Keep cached HTML and private lookup files internal-only.
# Public CSS, font assets, cached_uris.json, and lookup_uris.json remain accessible to the frontend.
location ~* /(?:cache|uploads)/speedify-spress-[^/]+/(?:[^/]+/)*(?:index(?:-[A-Za-z0-9_-]+)*\.html(?:\.gz)?|CSS_page_cache\.html(?:\.gz)?|lookup\.json|update_required)$ {
    internal;
}
