# Advanced: add near the top of the WordPress root .htaccess, before WordPress rewrite rules.
# Configured URL and user-agent exclusions are included below; re-copy after changing them.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{ENV:REDIRECT_STATUS} ^$
RewriteCond %{REQUEST_METHOD} ^GET$
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP_COOKIE} !(?:^|;\x20*)(?:wordpress_logged_in_|wp-postpass_|woocommerce_items_in_cart|woocommerce_cart_hash|wptouch_switch_toogle|comment_author_|comment_author_email_|comment_|woocommerce_|wordpressuser_|wordpresspass_|wordpress_sec_|yith_wcwl_products|edd_items_in_cart|it_exchange_session_|dshack_level|auth|noaffiliate_|mp_session|mp_globalcart_|xf_)[^=;]*= [NC]
RewriteCond %{REQUEST_URI} !/(?:wp-admin|wp-login\.php|wp-json|wp-cron\.php)(?:/|$) [NC]
{{BYPASS_URL_CONDITIONS}}
{{BYPASS_USER_AGENT_CONDITIONS}}
# SERVER_NAME selects this request's hostname directory, so the snippet can be reused across domains.
RewriteCond %{DOCUMENT_ROOT}{{CACHE_URL_BASE_PATH}}/%{SERVER_NAME}%{REQUEST_URI}/update_required !-f
RewriteCond %{DOCUMENT_ROOT}{{CACHE_URL_BASE_PATH}}/%{SERVER_NAME}%{REQUEST_URI}/index.html -f
RewriteRule ^ {{CACHE_URL_BASE_PATH}}/%{SERVER_NAME}%{REQUEST_URI}/index.html [END,E=SPRESS_CACHE_HIT:1]
</IfModule>

<IfModule mod_headers.c>
Header always set x-spdy-cache "HIT" env=SPRESS_CACHE_HIT
Header always set x-spdy-source "Apache" env=SPRESS_CACHE_HIT
Header always set Cache-Control "public, max-age=0, s-maxage=2592000, stale-while-revalidate=300, stale-if-error=86400" env=SPRESS_CACHE_HIT
Header always set CDN-Cache-Control "max-age=2592000" env=SPRESS_CACHE_HIT
</IfModule>
