# Add near the top of the WordPress root .htaccess, before WordPress rewrite rules.
# This blocks direct HTTP requests for generated cache files while leaving PHP access unaffected.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{THE_REQUEST} [[:space:]]{{CACHE_URL_BASE_PATH_REGEX}}/[^[:space:]]* [NC]
RewriteRule ^ - [F,L]
</IfModule>
