# Add near the top of the WordPress root .htaccess, before WordPress rewrite rules.
# Keep cached page HTML and private CSS lookup files from being requested directly.
# Public CSS, font assets, cached_uris.json, and lookup_uris.json remain accessible to the frontend.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{THE_REQUEST} [[:space:]]{{CACHE_URL_BASE_PATH_REGEX}}/[^[:space:]]*/(?:index(?:-[^/[:space:]]+)*\.html(?:\.gz)?|CSS_page_cache\.html(?:\.gz)?|lookup\.json|update_required)(?:\?[^[:space:]]*)?[[:space:]] [NC]
RewriteRule ^ - [F,L]
</IfModule>
