# Place inside nginx.conf's http {} block, not inside a server {} block.
# Configured URL, user-agent, and cookie exclusions are included below.
map $uri $spress_url_excluded {
    default 0;
{{BYPASS_URL_MAP}}
}

map $http_user_agent $spress_useragent_excluded {
    default 0;
{{BYPASS_USER_AGENT_MAP}}
}

map $http_cookie $spress_cookie_excluded {
    default 0;
    "~*(?:^|;[ \t]*)(?:wordpress_logged_in_|wp-postpass_|woocommerce_items_in_cart|woocommerce_cart_hash|wptouch_switch_toogle|comment_author_|comment_author_email_|comment_|woocommerce_|wordpressuser_|wordpresspass_|wordpress_sec_|yith_wcwl_products|edd_items_in_cart|it_exchange_session_|dshack_level|auth|noaffiliate_|mp_session|mp_globalcart_|xf_)[^=;]*=" 1;
}

map $spress_cache_path $spress_cache_status {
    default "";
    "~^{{CACHE_URL_BASE_PATH}}/" HIT;
}

map $spress_cache_status $spress_cache_control {
    default "";
    HIT "public, max-age=0, s-maxage=2592000, stale-while-revalidate=300, stale-if-error=86400";
}

map $spress_cache_status $spress_cdn_cache_control {
    default "";
    HIT "max-age=2592000";
}

map "$request_method|$spress_cookie_excluded|$args|$uri|$spress_url_excluded|$spress_useragent_excluded" $spress_cache_path {
    default /__spress_cache_bypass__;
    "~^GET\|0\|\|(?!.*/(?:wp-admin(?:/|$)|wp-login\.php$|wp-json(?:/|$)|wp-cron\.php$|wp-content(?:/|$)|wp-includes(?:/|$)))(?!.*/[^/]+\.[^/]+\|).*\|0\|0$" {{CACHE_URL_BASE_PATH}}/$host$uri/index.html;
}
