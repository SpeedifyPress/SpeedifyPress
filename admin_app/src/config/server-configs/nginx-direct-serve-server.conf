# Merge inside the existing site's server {} block; do not add a second server {}.
set $spress_cache_candidate $spress_cache_path;

# Keep this set-only if at server scope so the location's try_files remains active.
if (-f "$document_root{{CACHE_URL_BASE_PATH}}/$host$uri/update_required") {
    set $spress_cache_candidate /__spress_cache_bypass__;
}

location / {
    add_header x-spdy-cache $spress_cache_status;
    add_header x-spdy-source Nginx;
    add_header Cache-Control $spress_cache_control;
    add_header CDN-Cache-Control $spress_cdn_cache_control;

    try_files $spress_cache_candidate $uri $uri/ /index.php?$args;
}
